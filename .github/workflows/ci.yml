name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least-privilege GITHUB_TOKEN: this CI only reads the repo and runs tests — it
# never comments, pushes, or edits, so a compromised step can't write.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-and-scripts:
    name: Validate devnet config & scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Check version pins (versions.json vs network_params)
        run: python scripts/check-versions.py

      - name: Validate devnet/network_params.yaml
        run: python scripts/validate_network_params.py

      - name: Check config consistency (network_params vs deploy-config)
        run: python scripts/check-config-consistency.py

      - name: Lint Sepolia deploy-config
        run: python scripts/validate-sepolia-config.py

      - name: Secret scan
        run: python scripts/scan-secrets.py

      - name: Check L2 genesis (skips in CI until a devnet run generates it)
        run: python scripts/check-l2-genesis.py

      - name: Validate deploy-config JSON
        run: |
          for f in packages/contracts-bedrock/deploy-config/*.json; do
            echo "checking $f"
            python -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: Syntax-check shell scripts
        run: |
          for s in scripts/*.sh; do bash -n "$s" && echo "ok: $s"; done

      - name: Syntax-check node scripts
        run: |
          node --check test/e2e/withdrawal-roundtrip/roundtrip.mjs
          node --check ops/health/health.mjs
          node --check ops/dispute-mon/dispute-mon.mjs
          node --check ops/da-check/da-check.mjs

      # ShellCheck via apt rather than a third-party action pinned to a mutable
      # branch (supply-chain hardening — see docs/audits/repo-posture-review.md).
      - name: ShellCheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh scripts/hooks/*

  js-unit:
    name: JS unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - test/e2e/withdrawal-roundtrip
          - ops/health
          - ops/dispute-mon
          - ops/da-check
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci

      - name: Unit tests (pure logic, no devnet)
        run: npm run test:unit

  contracts:
    name: Foundry (contracts-bedrock)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts-bedrock
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install forge-std
        run: forge install foundry-rs/forge-std

      - name: Check formatting
        run: forge fmt --check

      # NOTE: this package currently holds only a scaffold example + JSON
      # deploy-config invariant tests — a green check here does NOT imply
      # coverage of any bridge/portal/predeploy (none are vendored yet). A real
      # Foundry suite + chain-security-auditor pass gate any real-value deploy.
      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv
        env:
          FOUNDRY_PROFILE: ci
