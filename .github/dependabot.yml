version: 2
updates:
  # e2e acceptance-test deps (viem).
  - package-ecosystem: "npm"
    directory: "/test/e2e/withdrawal-roundtrip"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"

  # GitHub Actions used in CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
